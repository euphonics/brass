name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run license:headers:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      # Fail only on problems in packages the plugin ships with. Problems in
      # build and test tools are still listed but don't fail the run.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high || true
      - run: npm run build
